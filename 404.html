<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07070a">
  <title>找不到這一頁｜新時代物理學習平台</title>
  <link rel="icon" href="/zoo/icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Silkscreen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/zoo/style.css?v=9">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; text-align: center; padding: 24px; }
    .lost { max-width: 420px; }
    .lost .num { font-family: "Silkscreen", monospace; font-size: 4.5rem; line-height: 1; background: var(--sign); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lost .m { width: 120px; margin: 26px auto 22px; }
    .lost h1 { margin: 0 0 8px; font-size: 1.5rem; font-weight: 900; }
    .lost p { margin: 0 0 28px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="lost">
    <div class="num">404</div>
    <div class="m">
      <svg class="mascot bob look-r" viewBox="0 -1 16 11" shape-rendering="crispEdges" aria-hidden="true">
        <g fill="#d9805f">
          <g class="m-legs-a"><rect x="3" y="7" width="1" height="3"/><rect x="10" y="7" width="1" height="3"/></g>
          <g class="m-legs-b"><rect x="5" y="7" width="1" height="3"/><rect x="12" y="7" width="1" height="3"/></g>
          <g class="m-body">
            <rect x="0" y="4" width="2" height="2"/><rect x="14" y="4" width="2" height="2"/>
            <rect x="2" y="0" width="12" height="7"/>
            <g class="m-look"><g class="m-eyes" fill="#1c0f0a"><rect x="3" y="2" width="1" height="2"/><rect x="10" y="2" width="1" height="2"/></g></g>
          </g>
        </g>
      </svg>
    </div>
    <h1>糟糕，吉祥物迷路了</h1>
    <p>這一頁不存在，可能是網址打錯，或影片已經搬家了。</p>
    <a class="btn btn-primary" href="/zoo/">回到首頁</a>
  </main>
</body>
</html>
