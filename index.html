<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07070a">
  <title>新時代物理學習平台</title>
  <meta name="description" content="大川的物理學習頻道：從運動學、力學與能量、分析力學到熱學，依集數一步步學會物理奧林匹亞，免費線上看。">
  <link rel="canonical" href="https://derek1000403-glitch.github.io/zoo/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="新時代物理學習平台">
  <meta property="og:title" content="新時代物理學習平台｜大川的物理學習頻道">
  <meta property="og:description" content="從運動學到熱學，依集數一步步學會物理。有可愛吉祥物陪你一起看！">
  <meta property="og:url" content="https://derek1000403-glitch.github.io/zoo/">
  <meta property="og:image" content="https://derek1000403-glitch.github.io/zoo/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="zh_TW">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="物理學習">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 -3 16 16' shape-rendering='crispEdges'%3E%3Cg fill='%23D9805F'%3E%3Crect x='2' width='12' height='7'/%3E%3Crect y='4' width='16' height='2'/%3E%3Crect x='3' y='7' width='1' height='3'/%3E%3Crect x='5' y='7' width='1' height='3'/%3E%3Crect x='10' y='7' width='1' height='3'/%3E%3Crect x='12' y='7' width='1' height='3'/%3E%3C/g%3E%3Cg fill='%231C0F0A'%3E%3Crect x='3' y='2' width='1' height='2'/%3E%3Crect x='10' y='2' width='1' height='2'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="./" aria-label="回到首頁">
        <span id="brand-mascot"></span>
        <span id="site-name" class="brand-name">新時代物理學習平台</span>
      </a>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="搜尋影片" aria-label="搜尋影片" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <button id="account" class="account" hidden></button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-bg" aria-hidden="true">
      <div class="grid-floor"></div>
      <svg class="arc" viewBox="0 0 1200 500" preserveAspectRatio="none">
        <path id="arc-path" d="M-20 470 Q 420 -150 860 470" />
        <circle r="5"><animateMotion dur="5.5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#arc-path"/></animateMotion></circle>
      </svg>
      <span class="formula f1">v = dx/dt</span>
      <span class="formula f2">F = ma</span>
      <span class="formula f3">E = ½mv²</span>
      <span class="formula f4">L = T − V</span>
      <span class="formula f5">PV = nRT</span>
    </div>
    <div class="shapes" aria-hidden="true">
      <svg class="shape s1" viewBox="0 0 40 40"><path d="M20 4 37 34H3Z"/></svg>
      <svg class="shape s2" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/></svg>
      <svg class="shape s3" viewBox="0 0 40 40"><path d="M6 6l28 28M34 6 6 34"/></svg>
      <svg class="shape s4" viewBox="0 0 40 40"><path d="M20 4 37 34H3Z"/></svg>
    </div>
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <p class="kicker">PHYSICS OLYMPIAD · 物奧教學</p>
        <h1 id="hero-title">新時代物理學習平台</h1>
        <p id="site-tagline" class="tagline"></p>
        <div class="hero-actions">
          <button id="cta" class="btn btn-primary"></button>
          <a class="btn btn-ghost" href="#units">瀏覽單元</a>
        </div>
        <dl class="stats">
          <div><dt>集數</dt><dd id="stat-eps"></dd></div>
          <div><dt>單元</dt><dd id="stat-units"></dd></div>
          <div><dt>已完成</dt><dd id="stat-done"></dd></div>
        </dl>
      </div>

      <div class="hero-stage">
        <div class="sun-clip" aria-hidden="true"><div class="sun"></div></div>
        <div class="glow" aria-hidden="true"></div>
        <div class="sign-wrap">
          <div class="pixels" aria-hidden="true"></div>
          <span id="hero-mascot" class="sign-mascot" title="點我！"></span>
          <button id="hero-sign" class="sign">
            <span id="sign-kicker" class="sign-kicker"></span>
            <span id="sign-title" class="sign-title"></span>
            <span id="sign-sub" class="sign-sub"></span>
          </button>
          <div class="poles" aria-hidden="true"><i></i><i></i></div>
        </div>
        <div class="road" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <main id="units" class="wrap">
    <nav id="categories" class="tabs" aria-label="單元"></nav>
    <div id="empty" class="empty" hidden></div>
    <div id="content"></div>
  </main>

  <footer class="footer">
    <div class="wrap">
      <dl class="site-stats">
        <div><dd id="sv-total">—</dd><dt>總瀏覽次數</dt></div>
        <div><dd id="sv-today">—</dd><dt>今日瀏覽</dt></div>
        <div><dd id="sv-plays">—</dd><dt>影片播放次數</dt></div>
      </dl>
    </div>
    <div class="footer-road" aria-hidden="true"><span id="walker" class="walker"></span></div>
    <div class="wrap footer-inner">
      <span id="footer-text"></span>
      <span class="footer-links">
        <a href="privacy.html">隱私權政策</a>
        <a href="https://www.youtube.com/t/terms" target="_blank" rel="noopener">YouTube 服務條款</a>
        <button id="reset" class="link-btn">清除學習紀錄</button>
      </span>
    </div>
  </footer>

  <dialog id="player" aria-label="影片播放">
    <div id="ambient" class="ambient" aria-hidden="true"></div>
    <div class="player-top">
      <div class="crumb"><span id="crumb-unit" class="pill"></span><span id="crumb-ep" class="pixel-text"></span></div>
      <div class="player-actions">
        <button id="share" class="icon-btn" title="複製這一集的連結">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
          <span>複製連結</span>
        </button>
        <button id="close" class="icon-btn icon-only" aria-label="關閉">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="player-body">
      <div class="player-main">
        <div id="frame-wrap" class="frame-wrap">
          <div id="lane" class="lane">
            <div id="ask" class="ask" role="dialog" aria-label="吉祥物的詢問"></div>
            <button id="fs-exit" class="fs-exit">縮小 <kbd>Esc</kbd></button>
            <div id="buddy" class="buddy" title="點我！" aria-hidden="true">
              <div class="buddy-hop"><div class="buddy-flip"></div></div>
              <div class="bubble"></div>
              <div class="zzz"><i>z</i><i>z</i><i>Z</i></div>
            </div>
          </div>
          <div class="frame"><div id="yt"></div></div>
        </div>
        <div class="now-info">
          <h2 id="player-title"></h2>
          <p id="player-desc"></p>
        </div>
        <div class="controls">
          <button id="prev" class="btn btn-ghost btn-sm">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6 9 12l6 6"/></svg>上一集
          </button>
          <button id="next" class="btn btn-primary btn-sm">下一集
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
          </button>
          <label class="switch">
            <input id="auto-next" type="checkbox" checked>
            <span class="track"><span class="thumb-dot"></span></span>
            自動播放下一集
          </label>
          <span class="hint">快捷鍵 <kbd>P</kbd> 上一集 <kbd>N</kbd> 下一集 <kbd>F</kbd> 放大</span>
        </div>
        <div class="social">
          <button id="like-btn" class="soc-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v11H3V10zM7 10l4-8c1.7 0 3 1.3 3 3v4h5.5a2 2 0 0 1 2 2.3l-1.4 8A2 2 0 0 1 18.1 21H7"/></svg>
            <span>按讚</span>
          </button>
          <button id="sub-btn" class="soc-btn soc-sub">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
            <span>訂閱頻道</span>
          </button>
          <button id="fs-btn" class="soc-btn soc-fs" title="放大（吉祥物會一起陪你看）">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
            <span>放大</span>
          </button>
          <span id="soc-note" class="soc-note"></span>
        </div>
      </div>
      <aside class="player-list">
        <div class="pl-head">
          <div><strong id="playlist-name"></strong><span id="playlist-pos"></span></div>
          <div class="bar"><i id="playlist-bar"></i></div>
        </div>
        <div id="playlist-items"></div>
      </aside>
    </div>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="videos.js?v=9"></script>
  <script src="app.js?v=11"></script>
</body>
</html>
