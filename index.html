<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大川物奧教學</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 id="site-name">大川物奧教學</h1>
      <p id="site-tagline" class="tagline"></p>
      <input id="search" type="search" placeholder="搜尋影片…" aria-label="搜尋影片">
      <nav id="categories" class="chips" aria-label="分類"></nav>
    </div>
  </header>

  <main class="wrap">
    <p id="empty" class="empty" hidden>找不到符合的影片。</p>
    <div id="content"></div>
  </main>

  <dialog id="player">
    <div class="player-box">
      <button id="close" class="close" aria-label="關閉">✕</button>
      <div class="player-main">
        <div class="frame"><div id="yt"></div></div>
        <h2 id="player-title"></h2>
        <p id="player-desc"></p>
        <div class="controls">
          <button id="prev">⏮ 上一集</button>
          <button id="next">下一集 ⏭</button>
          <label class="auto"><input id="auto-next" type="checkbox" checked> 自動播放下一集</label>
        </div>
      </div>
      <aside class="player-list">
        <div class="pl-head"><strong id="playlist-name"></strong><span id="playlist-pos"></span></div>
        <div id="playlist-items"></div>
      </aside>
    </div>
  </dialog>

  <footer class="wrap footer"></footer>

  <script src="videos.js?v=2"></script>
  <script src="app.js?v=2"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
